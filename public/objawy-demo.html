<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>BM Clinic — możliwości leczenia i mapa objawów</title><style>body{margin:0;background:#e8ede8}button,select,textarea{font:inherit}*{box-sizing:border-box}.symptom-app {
  --sm-bg: #101f1c;
  --sm-card: #1b302b;
  --sm-ink: #f0eee6;
  --sm-muted: #c2cdc5;
  --sm-line: #62786b;
  --sm-accent: #d4e1d3;
  color: var(--sm-ink);
  background: var(--sm-bg);
  border: 1px solid var(--sm-line);
  border-radius: 22px;
  padding: clamp(18px, 3vw, 38px);
  margin: 30px 0;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
}
.symptom-app[data-specialty="flebologia"] {
  --sm-bg: #efedf3;
  --sm-card: #fbfafc;
  --sm-ink: #302d3e;
  --sm-muted: #615c71;
  --sm-line: #a8a0ba;
  --sm-accent: #655977;
}
.symptom-app * {
  box-sizing: border-box;
}
.symptom-app h2,
.symptom-app h3,
.symptom-app h4 {
  color: var(--sm-ink);
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 400;
}
.symptom-app h2 {
  font-size: clamp(30px, 4vw, 48px);
  margin: 12px 0 18px;
}
.symptom-app h3 {
  font-size: 26px;
  line-height: 1.2;
}
.symptom-app p {
  line-height: 1.65;
}
.symptom-app button,
.symptom-app select,
.symptom-app textarea {
  font: inherit;
  color: var(--sm-ink);
}
.symptom-app button {
  min-height: 44px;
  padding: 10px 14px;
  border: 1px solid var(--sm-line);
  border-radius: 9px;
  background: transparent;
  cursor: pointer;
  line-height: 1.35;
  white-space: normal;
  text-align: left;
}
.symptom-app button:hover {
  background: color-mix(in srgb, var(--sm-accent) 13%, transparent);
}
.symptom-app button[aria-pressed="true"] {
  background: var(--sm-accent);
  color: var(--sm-bg);
  border-color: var(--sm-accent);
}
.symptom-app button:disabled {
  cursor: default;
  opacity: 0.5;
}
.symptom-app :focus-visible {
  outline: 3px solid var(--sm-accent);
  outline-offset: 4px;
}
.symptom-eyebrow {
  font-size: 11px !important;
  font-weight: 700;
  letter-spacing: 0.13em;
  color: var(--sm-muted);
}
.symptom-explainer {
  max-width: 80ch;
  font-size: 15px;
  color: var(--sm-muted);
}
.symptom-intro > p:not(.symptom-eyebrow) {
  max-width: 80ch;
}
.symptom-safety {
  border: 1px solid var(--sm-line);
  padding: 16px 20px;
  margin: 24px 0;
  border-radius: 12px;
}
.symptom-safety h3 {
  font:
    600 17px Arial,
    Helvetica,
    sans-serif;
  margin: 0 0 10px;
}
.symptom-safety p {
  font-size: 14px;
  margin: 8px 0;
  color: var(--sm-muted);
}
.symptom-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  margin: 20px 0;
}
.symptom-toolbar > div {
  display: flex;
  gap: 8px;
}
.symptom-toolbar > span {
  font-size: 14px;
  color: var(--sm-muted);
}
.symptom-map-container {
  position: relative;
  border: 1px solid var(--sm-line);
  border-radius: 15px;
  overflow: hidden;
  background: radial-gradient(
    ellipse at 50% 30%,
    color-mix(in srgb, var(--sm-accent) 8%, var(--sm-bg)),
    var(--sm-bg)
  );
}
.symptom-map-container[hidden] {
  display: none;
}
.symptom-map-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 10px 12px;
  border-bottom: 1px solid var(--sm-line);
}
.symptom-map-controls button {
  font-size: 14px;
}
.symptom-map-controls output {
  margin-left: auto;
  min-width: 45px;
  text-align: right;
  color: var(--sm-muted);
  font-size: 13px;
}
.symptom-viewport {
  height: 640px;
  width: 100%;
  position: relative;
  overflow: hidden;
  touch-action: none;
  cursor: grab;
  user-select: none;
}
.symptom-viewport:active {
  cursor: grabbing;
}
.symptom-world {
  position: absolute;
  left: 0;
  top: 0;
  width: 1450px;
  height: 960px;
  transform-origin: 0 0;
  will-change: transform;
}
.symptom-overview {
  transition: opacity 0.3s;
}
.symptom-overview.is-dimmed {
  opacity: 0.08;
}
.symptom-overview-lines {
  position: absolute;
  left: 0;
  top: 0;
  overflow: visible;
  pointer-events: none;
}
.symptom-overview-lines path,
.symptom-detail-lines path {
  fill: none;
  stroke: var(--sm-line);
  stroke-width: 2;
}
.symptom-overview-lines path.is-chosen {
  stroke: var(--sm-accent);
  stroke-width: 5;
}
.symptom-map-group {
  position: absolute;
  padding: 20px 22px 18px;
  border: 1px solid var(--sm-line);
  border-radius: 18px;
  background: var(--sm-card);
  box-shadow: 0 15px 50px #0002;
}
.symptom-group-number {
  font-size: 13px;
  color: var(--sm-muted);
  letter-spacing: 0.1em;
}
.symptom-map-group h3 {
  font-size: 28px;
  margin: 10px 0;
}
.symptom-map-group > p {
  font-size: 14px;
  line-height: 1.35;
  margin: 0 0 12px;
  color: var(--sm-muted);
  min-height: 38px;
}
.symptom-map-row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 62px;
  border-top: 1px solid color-mix(in srgb, var(--sm-line) 45%, transparent);
}
.symptom-map-row > button {
  flex: 1;
  border: 0;
  padding: 10px 0;
  font-size: 18px;
  display: flex;
  justify-content: space-between;
}
.symptom-map-row > input {
  width: 22px;
  height: 22px;
  accent-color: var(--sm-accent);
  cursor: pointer;
}
.symptom-map-row.is-chosen > button {
  font-weight: 700;
}
.symptom-map-row.is-chosen {
  border-left: 3px solid var(--sm-accent);
  padding-left: 8px;
}
.symptom-hub {
  position: absolute;
  left: 530px;
  top: 780px;
  width: 370px;
  min-height: 140px;
  border: 1px solid var(--sm-accent);
  border-radius: 18px;
  padding: 20px 24px;
  text-align: center;
  background: var(--sm-card);
}
.symptom-hub > span,
.symptom-center > span {
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--sm-muted);
}
.symptom-hub strong {
  display: block;
  font: 24px/1.3 Georgia;
  margin: 10px 0;
}
.symptom-hub p {
  font-size: 14px;
  margin: 0;
}
.symptom-detail-lines {
  position: absolute;
  overflow: visible;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.5s;
}
.is-expanded .symptom-detail-lines {
  opacity: 1;
}
.symptom-center {
  position: absolute;
  width: 280px;
  min-height: 160px;
  padding: 20px;
  border: 1px solid var(--sm-accent);
  background: var(--sm-card);
  border-radius: 18px;
  text-align: center;
  z-index: 2;
  box-shadow: 0 8px 30px #0003;
}
.symptom-center h3 {
  font-size: 27px;
  margin: 12px 0;
}
.symptom-center button {
  font-size: 15px;
  min-height: 44px;
}
.symptom-arm {
  position: absolute;
  width: 350px;
  height: 250px;
  overflow: hidden;
  padding: 22px 24px;
  border: 1px solid var(--sm-line);
  border-radius: 16px;
  background: var(--sm-card);
  box-shadow: 0 12px 30px #0002;
  transition:
    transform 0.65s cubic-bezier(0.4, 0, 0.2, 1),
    opacity 0.45s;
}
.symptom-arm > span {
  font-size: 12px;
  color: var(--sm-muted);
  letter-spacing: 0.12em;
}
.symptom-arm h3 {
  font-size: 26px;
  margin: 10px 0;
}
.symptom-arm p {
  font-size: 16px;
  line-height: 1.45;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 4;
  overflow: hidden;
  margin: 0 0 12px;
}
.symptom-arm-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.symptom-arm-tags span {
  font-size: 12px;
  padding: 3px 8px;
  border: 1px solid var(--sm-line);
  border-radius: 20px;
}
.symptom-minimap {
  position: absolute !important;
  right: 14px;
  bottom: 72px;
  width: 138px;
  height: 110px;
  background: var(--sm-card) !important;
  display: block !important;
  box-shadow: 0 4px 20px #0003;
  padding: 8px !important;
}
.symptom-minimap svg {
  display: block;
  width: 100%;
  height: 70px;
}
.symptom-minimap rect,
.symptom-minimap circle {
  fill: var(--sm-bg);
  stroke: var(--sm-line);
  stroke-width: 10;
}
.symptom-minimap rect.is-chosen {
  fill: var(--sm-accent);
}
.symptom-minimap rect.symptom-camera-rect {
  fill: transparent;
  stroke: var(--sm-accent);
  stroke-width: 10;
  stroke-dasharray: 20 10;
}
.symptom-minimap > span {
  display: block;
  text-align: center;
  font-size: 11px;
}
.symptom-map-help {
  padding: 12px 16px;
  margin: 0;
  color: var(--sm-muted);
  font-size: 12px;
  max-width: 85ch;
  min-height: 58px;
}
.symptom-topic-jump {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: 16px;
  margin: 22px 0;
}
.symptom-topic-jump label {
  font-size: 15px;
}
.symptom-topic-jump select {
  width: 100%;
  padding: 12px;
  background: var(--sm-card);
  border: 1px solid var(--sm-line);
  border-radius: 8px;
  min-height: 46px;
  font-size: 16px;
}
.symptom-reading-groups {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}
.symptom-reading-groups > section {
  border: 1px solid var(--sm-line);
  background: var(--sm-card);
  padding: 18px;
  border-radius: 12px;
}
.symptom-reading-groups h3 {
  font-size: 24px;
  margin: 8px 0;
}
.symptom-reading-groups p {
  font-size: 14px;
  color: var(--sm-muted);
  min-height: 44px;
}
.symptom-list-row {
  border-top: 1px solid var(--sm-line);
  padding: 10px 0;
}
.symptom-list-row > button {
  display: block;
  width: 100%;
  border: 0;
  padding-left: 0;
}
.symptom-list-row label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  min-height: 44px;
}
.symptom-list-row input {
  width: 20px;
  height: 20px;
  accent-color: var(--sm-accent);
}
.symptom-reading {
  padding: 28px 0;
  border-top: 1px solid var(--sm-line);
  margin-top: 28px;
}
.symptom-reading-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}
.symptom-reading-title h3 {
  font-size: 34px;
  margin: 10px 0 24px;
}
.symptom-reading-arms {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}
.symptom-reading-arms > section {
  border: 1px solid var(--sm-line);
  border-radius: 12px;
  padding: 22px;
  background: var(--sm-card);
}
.symptom-reading-arms h4 {
  font-size: 24px;
  margin: 12px 0;
}
.symptom-reading-arms p {
  font-size: 16px;
  line-height: 1.65;
}
.symptom-feature-buttons {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.symptom-feature-buttons button {
  font-size: 14px;
  min-height: 44px;
}
.symptom-private-note {
  font-size: 13px !important;
  color: var(--sm-muted);
}
.symptom-note-label {
  display: block;
  font-size: 15px;
  margin: 20px 0;
}
.symptom-note-label textarea {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 1px solid var(--sm-line);
  border-radius: 9px;
  background: var(--sm-card);
  font-size: 16px;
}
.symptom-summary {
  margin-top: 28px;
  padding: 26px;
  border: 1px solid var(--sm-line);
  border-radius: 16px;
  background: var(--sm-card);
}
.symptom-summary h3 {
  font-size: 30px;
  margin: 12px 0 18px;
}
.symptom-summary > ul {
  list-style: none;
  margin: 24px 0;
  padding: 0;
}
.symptom-summary li {
  padding: 14px 0;
  border-top: 1px solid var(--sm-line);
}
.symptom-summary li > div {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
.symptom-summary li > div > button:first-child {
  border: 0;
  padding-left: 0;
  font-size: 18px;
  font-weight: 600;
}
.symptom-summary li p {
  color: var(--sm-muted);
  margin: 8px 0;
}
.symptom-summary-note {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.symptom-summary-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.symptom-remove {
  font-size: 12px !important;
}
.symptom-summary-empty {
  color: var(--sm-muted);
}
.symptom-sources {
  margin-top: 24px;
  font-size: 14px;
}
.symptom-sources summary {
  cursor: pointer;
  min-height: 44px;
  padding: 10px 0;
}
.symptom-sources li {
  margin: 10px 0;
}
.symptom-sources a {
  color: inherit;
}
.symptom-route {
  max-width: 1440px;
  padding: 25px 4vw;
  margin: auto;
}
.symptom-route > a {
  display: inline-block;
  margin: 15px 0;
}
.symptom-full-link {
  display: inline-block;
  margin: 12px 0;
}
.symptom-map-demo-header {
  max-width: 1360px;
  margin: auto;
  padding: 24px;
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  color: #263b34;
  font-family: Arial, Helvetica, sans-serif;
}
.symptom-map-demo-header strong {
  margin-right: auto;
}
.symptom-map-demo-header button {
  min-height: 44px;
  padding: 10px 16px;
  cursor: pointer;
  border: 1px solid #789083;
  border-radius: 8px;
  background: white;
  color: #20382d;
  font: inherit;
}
.symptom-map-demo-note {
  padding: 0 24px;
  max-width: 1360px;
  margin: 10px auto;
  font:
    14px/1.5 Arial,
    Helvetica,
    sans-serif;
  color: #344d43;
}
@media (max-width: 750px) {
  .symptom-app {
    padding: 18px 12px;
    border-radius: 14px;
  }
  .symptom-viewport {
    height: 440px;
  }
  .symptom-map-controls {
    gap: 6px;
  }
  .symptom-map-controls button {
    padding: 10px;
    font-size: 13px;
  }
  .symptom-minimap {
    width: 104px;
    height: 92px;
    bottom: 90px;
  }
  .symptom-minimap svg {
    height: 52px;
  }
  .symptom-map-help {
    font-size: 12px;
    min-height: 78px;
  }
  .symptom-reading-groups,
  .symptom-reading-arms {
    grid-template-columns: 1fr;
  }
  .symptom-topic-jump {
    grid-template-columns: 1fr;
    gap: 10px;
  }
  .symptom-summary {
    padding: 20px 16px;
  }
  .symptom-reading-title {
    gap: 4px;
  }
  .symptom-reading-arms > section {
    padding: 20px;
  }
  .symptom-summary-actions {
    flex-direction: column;
  }
  .symptom-summary-actions button {
    width: 100%;
  }
}
@media (prefers-reduced-motion: reduce) {
  .symptom-app * {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}
@media print {
  .symptom-map-container,
  .symptom-toolbar,
  .symptom-topic-jump,
  .symptom-reading-groups,
  .symptom-reading,
  .symptom-safety,
  .symptom-sources,
  .symptom-summary-actions,
  .symptom-map-demo-header,
  .symptom-map-demo-note,
  .symptom-remove {
    display: none !important;
  }
  .symptom-app {
    color: #111 !important;
    background: white !important;
    border: 0;
    padding: 0;
  }
  .symptom-app h2,
  .symptom-app h3,
  .symptom-app p {
    color: #111 !important;
  }
  .symptom-summary {
    background: white !important;
    color: #111 !important;
    border: 1px solid #aaa;
  }
  .symptom-summary li button {
    color: #111 !important;
    border: 0;
  }
}
.treatment-navigator {
  --tn-bg: #152b24;
  --tn-ink: #f1eee5;
  --tn-muted: #c7d3c9;
  --tn-line: #698171;
  --tn-card: #203b30;
  background: var(--tn-bg);
  color: var(--tn-ink);
  padding: clamp(24px, 4vw, 48px);
  border: 1px solid var(--tn-line);
  border-radius: 20px;
  margin: 28px 0;
  font-family: Arial, Helvetica, sans-serif;
}
.treatment-navigator[data-specialty="flebologia"] {
  --tn-bg: #f0edf5;
  --tn-ink: #332d42;
  --tn-muted: #635a73;
  --tn-line: #b4a9c7;
  --tn-card: #fbf9fd;
}
.treatment-navigator h2,
.treatment-navigator h3,
.treatment-navigator h4 {
  font-family: Georgia, "Times New Roman", serif;
  color: var(--tn-ink);
  font-weight: 400;
}
.treatment-navigator h2 {
  font-size: clamp(30px, 4vw, 46px);
  line-height: 1.15;
  margin: 16px 0 22px;
}
.treatment-eyebrow {
  font-size: 11px;
  letter-spacing: 0.12em;
  font-weight: 700;
  color: var(--tn-muted);
}
.treatment-lead {
  max-width: 78ch;
  font-size: 18px;
  line-height: 1.7;
}
.treatment-goals {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin: 30px 0;
}
.treatment-goals > button {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-start;
  gap: 16px;
  min-height: 240px;
  padding: 24px;
  text-align: left;
  background: var(--tn-card);
  color: var(--tn-ink);
  border: 1px solid var(--tn-line);
  border-radius: 14px;
  font: inherit;
  cursor: pointer;
  line-height: 1.5;
}
.treatment-goals strong {
  font: 25px/1.25 Georgia;
}
.treatment-goals > button > span:not(.treatment-number) {
  font-size: 14px;
  color: var(--tn-muted);
}
.treatment-goals > button[aria-expanded="true"] {
  outline: 2px solid var(--tn-ink);
  outline-offset: 3px;
}
.treatment-number {
  font-size: 12px;
  letter-spacing: 0.12em;
}
.treatment-details {
  padding: 28px;
  background: var(--tn-card);
  border: 1px solid var(--tn-line);
  border-radius: 14px;
  margin: 20px 0;
}
.treatment-details > h3 {
  font-size: 30px;
  margin: 0 0 20px;
}
.treatment-details p,
.treatment-details li {
  line-height: 1.7;
}
.treatment-detail-columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
  margin: 24px 0;
}
.treatment-detail-columns h4 {
  font-size: 23px;
  margin: 10px 0;
}
.treatment-detail-columns ul {
  padding-left: 20px;
}
.treatment-detail-columns li {
  margin: 10px 0;
}
.treatment-navigator .button {
  display: inline-flex;
  min-height: 48px;
  background: var(--tn-ink);
  color: var(--tn-bg);
  border: 0;
  padding: 14px 20px;
  line-height: 1.4;
}
.treatment-fine,
.treatment-demo-cta {
  font-size: 14px;
  color: var(--tn-muted);
}
.treatment-principles {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
  border-top: 1px solid var(--tn-line);
  padding-top: 12px;
  margin-top: 30px;
}
.treatment-principles h3 {
  font-size: 24px;
}
.treatment-principles p {
  font-size: 15px;
  line-height: 1.7;
  color: var(--tn-muted);
}
.treatment-urgent {
  font-size: 13px;
  line-height: 1.65;
  border-top: 1px solid var(--tn-line);
  padding-top: 18px;
  margin-top: 24px;
  color: var(--tn-muted);
}
.symptom-map-disclosure > summary {
  cursor: pointer;
  font: 20px/1.5 Georgia;
  padding: 24px 0;
  min-height: 48px;
}
.treatment-navigator :focus-visible {
  outline: 3px solid var(--tn-ink);
  outline-offset: 5px;
}
@media (max-width: 750px) {
  .treatment-goals,
  .treatment-detail-columns,
  .treatment-principles {
    grid-template-columns: 1fr;
  }
  .treatment-goals > button {
    min-height: 180px;
  }
  .treatment-details {
    padding: 22px 18px;
  }
  .treatment-lead {
    font-size: 17px;
  }
  .treatment-navigator {
    padding: 25px 18px;
  }
}
.treatment-comfort {
  border: 1px solid var(--tn-line);
  border-radius: 12px;
  padding: 20px 24px;
  margin-top: 24px;
  background: var(--tn-card);
}
.treatment-comfort h3 {
  font-size: 24px;
  margin: 0 0 14px;
}
.treatment-comfort p {
  margin: 0;
  color: var(--tn-muted);
  line-height: 1.7;
}

7Cnienia od choroby.",["Na zewn\u0105trz","G\u0142\u0119biej","Wieczorem","Po wypr\xF3\u017Cnieniu"],["Drapanie","Podra\u017Cniona sk\xF3ra","Wilgo\u0107","Nawraca"],"Podaj u\u017Cywane kosmetyki, preparaty i dotychczasowe leczenie. Powiedz, czy obok \u015Bwi\u0105du pojawia si\u0119 pieczenie lub wyciek."],["burning","Pieczenie","Opisz uczucie pieczenia i to, z czym \u0142\u0105czy si\u0119 w czasie. Nie musisz nazywa\u0107 zmiany anatomicznej.",["Po wypr\xF3\u017Cnieniu","Podczas higieny","Przez wi\u0119ksz\u0105 cz\u0119\u015B\u0107 dnia",...tl.slice(0,2)],["Podra\u017Cnienie","Wilgo\u0107","Bolesno\u015B\u0107 sk\xF3ry"],"Wymie\u0144 stosowane ma\u015Bci i \u015Brodki do higieny oraz sytuacje, w kt\xF3rych objaw si\u0119 zmienia."],["pressure","Ucisk","Ucisk lub rozpieranie jest odczuciem, kt\xF3re warto opisa\u0107 niezale\u017Cnie od b\xF3lu.",["Przy siedzeniu","Po wypr\xF3\u017Cnieniu","Sta\u0142y","Okresowy"],["Rozpieranie","Uczucie przeszkody","Z b\xF3lem"],"Wska\u017C miejsce i czas trwania. Powiedz, czy odczucie towarzyszy zmianie wypr\xF3\u017Cnie\u0144 lub wyczuwalnej zmianie."],["urge","Parcie","Parcie to potrzeba wypr\xF3\u017Cnienia. Dla rozmowy wa\u017Cne jest tak\u017Ce to, czy oddanie stolca przynosi ulg\u0119.",["Przed wypr\xF3\u017Cnieniem","Po wypr\xF3\u017Cnieniu","Wielokrotnie w ci\u0105gu dnia"],["Nag\u0142a potrzeba","Bez oddania stolca","Nawraca"],"Opisz cz\u0119sto\u015B\u0107, nag\u0142o\u015B\u0107 i ewentualny \u015Bluz lub krew. Nie traktuj samego parcia jako rozpoznania."],["discomfort","Dyskomfort","Mo\u017Cesz zg\u0142osi\u0107 nieprzyjemne odczucie, nawet je\u015Bli nie potrafisz przypisa\u0107 go do b\xF3lu, \u015Bwi\u0105du czy pieczenia.",tl,["Trudno opisa\u0107","Przeszkadza w siedzeniu","Utrudnia codzienno\u015B\u0107"],"Powiedz, co si\u0119 zmieni\u0142o i co najbardziej utrudnia funkcjonowanie. Lekarz pomo\u017Ce doprecyzowa\u0107 opis."]]),mn(1,"Co zauwa\u017Casz?","Widoczne lub wyczuwalne zmiany i wydzielina.",[["bleeding","Krwawienie","Znaczenie ma ilo\u015B\u0107 krwi, jej wygl\u0105d i zwi\u0105zek z oddaniem stolca. Sam kolor nie ustala przyczyny.",["Na papierze","Na stolcu","W muszli","Po wypr\xF3\u017Cnieniu"],["Jasna krew","Ciemna krew","Skrzepy","Z b\xF3lem"],"Podaj cz\u0119sto\u015B\u0107, przybli\u017Con\u0105 ilo\u015B\u0107, przyjmowane leki i wcze\u015Bniejsze badania. Obfite krwawienie lub os\u0142abienie wymaga pomocy, a nie dalszego wype\u0142niania mapy."],["lump","Guzek","Opisz wyczuwaln\u0105 zmian\u0119 bez zgadywania, czym jest. Wa\u017Cne s\u0105 czas pojawienia si\u0119, bolesno\u015B\u0107 i zmiany wielko\u015Bci.",tl,["Bolesny","Niebolesny","Mi\u0119kki","Twardy"],"Powiedz, kiedy guzek si\u0119 pojawi\u0142 i czy zmienia si\u0119 podczas wypr\xF3\u017Cnienia. Nie uciskaj go ani nie nak\u0142uwaj na potrzeby opisu."],["prolapse","Wypadanie tkanek","Opisz, czy tkanka wysuwa si\u0119 na zewn\u0105trz i co dzieje si\u0119 potem. Stopie\u0144 i rodzaj zmiany ocenia lekarz.",["Podczas wypr\xF3\u017Cnienia","Podczas wysi\u0142ku","Pozostaje na zewn\u0105trz"],["Wraca samoistnie","Zwykle odprowadzam r\u0119k\u0105","Nie wraca","Nie wiem"],"Opisz dotychczasowe zachowanie zmiany; nie pr\xF3buj jej odprowadza\u0107 tylko po to, by odpowiedzie\u0107 na pytanie."],["discharge","Wyciek","Rozr\xF3\u017Cnij to, co widzisz na bieli\u017Anie lub papierze: \u015Bluz, wydzielin\u0119 albo \u015Blad stolca. Nie musisz samodzielnie ocenia\u0107 zaka\u017Cenia.",["Po wypr\xF3\u017Cnieniu","Mi\u0119dzy wypr\xF3\u017Cnieniami","Okresowo","Stale"],["\u015Aluz","Ropna wydzielina","\u015Alad stolca","Trudno okre\u015Bli\u0107"],"Powiedz o zapachu, ilo\u015Bci, b\xF3lu, gor\u0105czce i wcze\u015Bniejszym leczeniu ropnia lub przetoki, je\u015Bli dotyczy."],["moisture","Wilgo\u0107","Uczucie wilgotnej okolicy nie zawsze pozwala okre\u015Bli\u0107 rodzaj wydzieliny. Mo\u017Cna je zg\u0142osi\u0107 osobno.",tl,["Wilgotna bielizna","Podra\u017Cnienie","Trudno\u015Bci z higien\u0105"],"Opisz cz\u0119sto\u015B\u0107 i zwi\u0105zek z wypr\xF3\u017Cnieniem. Wspomnij o wycieku lub trudno\u015Bciach z utrzymaniem stolca, je\u017Celi wyst\u0119puj\u0105."],["swelling","Obrz\u0119k","Opisz miejsce i tempo narastania obrz\u0119ku. Sam obrz\u0119k nie wskazuje jednej choroby.",tl,["Bolesny","Zaczerwieniony","Nawracaj\u0105cy","Narastaj\u0105cy"],"Wspomnij o gor\u0105czce i narastaj\u0105cym b\xF3lu. Przy takim po\u0142\u0105czeniu potrzebna jest pilna ocena lekarska."]]),mn(2,"Rytm i kontrola","Jak wygl\u0105da wypr\xF3\u017Cnianie i co si\u0119 zmieni\u0142o.",[["constipation","Zaparcia","W opisie przydaj\u0105 si\u0119 cz\u0119sto\u015B\u0107 stolca, jego twardo\u015B\u0107 i konieczno\u015B\u0107 parcia.",["Od dawna","Nowy problem","Okresowo"],["Twardy stolec","Silne parcie","D\u0142ugie przebywanie w toalecie"],"Podaj, jak cz\u0119sto oddajesz stolec i co dotychczas stosowano. Wspomnij o nowej zmianie rytmu i krwawieniu."],["diarrhea","Biegunka","Wa\u017Cne s\u0105 liczba lu\u017Anych stolc\xF3w, czas trwania i objawy towarzysz\u0105ce.",tl,["Wodnisty stolec","Nag\u0142a potrzeba","\u015Aluz","Krew"],"Podaj liczb\u0119 stolc\xF3w, czas trwania, przyjmowane leki i objawy og\xF3lne. Krwista biegunka wymaga pilnej porady."],["incomplete","Niepe\u0142ne wypr\xF3\u017Cnienie","To uczucie, \u017Ce po oddaniu stolca nadal pozostaje potrzeba wypr\xF3\u017Cnienia. Nie jest samodzielnym rozpoznaniem.",["Po ka\u017Cdym wypr\xF3\u017Cnieniu","Czasami","Nowy problem"],["Powr\xF3t do toalety","Parcie","Uczucie przeszkody"],"Opisz, od kiedy wyst\u0119puje i czy \u0142\u0105czy si\u0119 z zaparciem, b\xF3lem lub wysuwaniem tkanek."],["rhythm","Zmiana rytmu","Por\xF3wnaj obecny rytm wypr\xF3\u017Cnie\u0144 ze swoim wcze\u015Bniejszym, zwyk\u0142ym rytmem.",["Od kilku dni","Od tygodni","Od miesi\u0119cy"],["Cz\u0119\u015Bciej ni\u017C zwykle","Rzadziej ni\u017C zwykle","Naprzemiennie"],"Powiedz o czasie zmiany, chudni\u0119ciu, krwi i wcze\u015Bniejszych badaniach jelita. Nie zak\u0142adaj, \u017Ce przyczyn\u0105 s\u0105 hemoroidy."],["gas","Kontrola gaz\xF3w","Trudno\u015B\u0107 z utrzymaniem gaz\xF3w warto zg\u0142osi\u0107 osobno od kontroli stolca. To wa\u017Cny temat tak\u017Ce przed zabiegiem.",["Codziennie","Okresowo","Od zabiegu"],["Nag\u0142a potrzeba","Nie zauwa\u017Cam momentu","Ogranicza codzienno\u015B\u0107"],"Powiedz, od kiedy wyst\u0119puje, jak cz\u0119sto i czy wcze\u015Bniej by\u0142y operacje, porody lub urazy, je\u017Celi dotyczy."],["stool","Kontrola stolca","Opisz sytuacje niezamierzonego oddania lub zabrudzenia stolcem. Nie musisz zna\u0107 medycznej nazwy problemu.",["Po wypr\xF3\u017Cnieniu","Mi\u0119dzy wypr\xF3\u017Cnieniami","Przy nag\u0142ej potrzebie"],["Zabrudzenie bielizny","P\u0142ynny stolec","Sta\u0142y stolec","Trudno okre\u015Bli\u0107"],"Wska\u017C cz\u0119sto\u015B\u0107 i wp\u0142yw na codzienno\u015B\u0107. Wspomnij o wcze\u015Bniejszych zabiegach i czasie pojawienia si\u0119 trudno\u015Bci."]])]},Zg={specialty:"flebologia",title:"Flebologia",lead:"Zobacz wygl\u0105d n\xF3g, odczucia i okoliczno\u015Bci na jednej mapie.",emergency:["Nowy jednostronny obrz\u0119k lub b\xF3l nogi, zw\u0142aszcza z zaczerwienieniem albo ociepleniem, wymaga pilnej oceny lekarskiej. Nie czekaj na odczyt mapy ani formularza.","Nag\u0142a duszno\u015B\u0107, b\xF3l w klatce piersiowej lub omdlenie mog\u0105 oznacza\u0107 stan zagro\u017Cenia \u017Cycia \u2014 dzwo\u0144 pod 112 lub 999.","Brak obrz\u0119ku stopy ani pojedynczego objawu nie wyklucza zakrzepicy. Mapa nie oblicza ryzyka i nie zast\u0119puje badania."],sources:[{label:"NICE NG158 \u2014 podejrzenie zakrzepicy i zatorowo\u015Bci",url:"https://www.nice.org.uk/guidance/NG158/chapter/recommendations"},{label:"NHS \u2014 zakrzepica \u017Cy\u0142 g\u0142\u0119bokich",url:"https://www.nhs.uk/conditions/deep-vein-thrombosis-dvt/"},{label:"NHS \u2014 \u017Cylaki",url:"https://www.nhs.uk/conditions/varicose-veins/"}],groups:[mn(0,"Co czujesz?","Odczucia, kt\xF3re warto opisa\u0107 niezale\u017Cnie od wygl\u0105du \u017Cy\u0142.",[["heaviness","Ci\u0119\u017Cko\u015B\u0107 n\xF3g","Opisz, kiedy nogi wydaj\u0105 si\u0119 ci\u0119\u017Ckie i jak to wp\u0142ywa na aktywno\u015B\u0107. Samo odczucie nie ustala przyczyny.",["Po staniu","Po siedzeniu","Wieczorem","Rano"],["Jedna noga","Obie nogi","Z obrz\u0119kiem"],"Powiedz o porze dnia, pracy, aktywno\u015Bci i zauwa\u017Canych zmianach."],["leg-pain","B\xF3l n\xF3g","Wa\u017Cne jest miejsce b\xF3lu, jego pocz\u0105tek i zwi\u0105zek z aktywno\u015Bci\u0105. Nie ka\u017Cdy b\xF3l nogi ma przyczyn\u0119 \u017Cyln\u0105.",["W spoczynku","Podczas chodzenia","Po staniu","Nag\u0142y pocz\u0105tek"],["\u0141ydka","Udo","Jedna noga","Obie nogi"],"Nowy jednostronny b\xF3l z obrz\u0119kiem wymaga pilnej oceny. Nie pr\xF3buj rozpoznawa\u0107 zakrzepicy testem domowym."],["tightness","Napi\u0119cie","Opisz uczucie napi\u0119cia lub rozpierania i jego lokalizacj\u0119.",tl,["\u0141ydka","Okolica kostki","Z obrz\u0119kiem"],"Wspomnij o nag\u0142ym pocz\u0105tku, asymetrii i ograniczeniu ruchu, je\u015Bli wyst\u0119puj\u0105."],["leg-burning","Pieczenie","Uczucie pieczenia mo\u017Ce dotyczy\u0107 sk\xF3ry lub by\u0107 odczuwane g\u0142\u0119biej. Przyczyn\u0119 ocenia lekarz.",["Wieczorem","Po wysi\u0142ku","W spoczynku"],["Na sk\xF3rze","G\u0142\u0119biej","Z podra\u017Cnieniem"],"Podaj miejsce, czas trwania i leki lub preparaty stosowane na sk\xF3r\u0119."],["leg-itch","\u015Awi\u0105d sk\xF3ry","Zwr\xF3\u0107 uwag\u0119 na miejsce \u015Bwi\u0105du i widoczne zmiany sk\xF3ry.",tl,["Sucha sk\xF3ra","Zaczerwienienie","Podra\u017Cnienie"],"Powiedz o nowych kosmetykach, opatrunkach, preparatach i wcze\u015Bniejszym leczeniu."],["cramps","Skurcze","Opisz, kt\xF3re mi\u0119\u015Bnie obejmuje skurcz i kiedy si\u0119 pojawia. Sam skurcz nie \u015Bwiadczy o niewydolno\u015Bci \u017Cylnej.",["W nocy","Podczas wysi\u0142ku","W spoczynku"],["\u0141ydka","Stopa","Nawraca"],"Podaj cz\u0119sto\u015B\u0107, czas trwania, przyjmowane leki i towarzysz\u0105ce dolegliwo\u015Bci."]]),mn(1,"Co zauwa\u017Casz?","Wygl\u0105d \u017Cy\u0142, obrz\u0119ki i zmiany sk\xF3ry.",[["varices","\u017Bylaki","Opisz widoczne poszerzone \u017Cy\u0142y i miejsca, w kt\xF3rych je zauwa\u017Casz. Zakres leczenia ustala si\u0119 po ocenie lekarskiej.",tl,["Prawa noga","Lewa noga","Obie nogi","Nawr\xF3t"],"Wspomnij o b\xF3lu, obrz\u0119ku, krwawieniu i wcze\u015Bniejszych zabiegach."],["spiders","Paj\u0105czki","Drobne widoczne naczynka mo\u017Cna opisa\u0107 niezale\u017Cnie od wi\u0119kszych \u017Cylak\xF3w. Ich wygl\u0105d nie przes\u0105dza o stanie ca\u0142ego uk\u0142adu \u017Cylnego.",tl,["Udo","\u0141ydka","Okolica kostki"],"Powiedz, od kiedy s\u0105 widoczne, czy przybywa naczynek i czy wyst\u0119puj\u0105 inne dolegliwo\u015Bci."],["leg-swelling","Obrz\u0119k n\xF3g","Znaczenie ma pocz\u0105tek, rozleg\u0142o\u015B\u0107 i to, czy obrz\u0119k dotyczy jednej czy obu n\xF3g.",["Rano","Wieczorem","Po staniu","Nag\u0142y pocz\u0105tek"],["Stopa","Kostka","\u0141ydka","Ca\u0142a noga"],"Nowy jednostronny obrz\u0119k wymaga pilnej oceny. Sam rozk\u0142ad obrz\u0119ku nie pozwala wykluczy\u0107 zakrzepicy."],["skin-colour","Zmiana koloru sk\xF3ry","Opisz kolor i miejsce zmiany oraz to, czy jest nowa.",tl,["Zaczerwienienie","Brunatne przebarwienie","Zasinienie"],"Wspomnij o b\xF3lu, ociepleniu, obrz\u0119ku i czasie narastania zmiany."],["skin-dryness","Sucha sk\xF3ra","Opisz \u0142uszczenie, podra\u017Cnienie i miejsca, kt\xF3rych dotycz\u0105.",tl,["\u0141uszczenie","Podra\u017Cnienie","\u015Awi\u0105d"],"Podaj stosowane preparaty i opatrunki; nie ka\u017Cda zmiana sk\xF3ry ma przyczyn\u0119 \u017Cyln\u0105."],["ulcer","Rana lub owrzodzenie","Wa\u017Cne s\u0105 lokalizacja, czas trwania i dotychczasowe gojenie rany. Nie ustalaj jej przyczyny samodzielnie.",tl,["S\u0105czenie","B\xF3l","Nawr\xF3t","Brak gojenia"],"Powiedz o dotychczasowym leczeniu, cukrzycy i wcze\u015Bniejszych badaniach. Narastaj\u0105cy b\xF3l, zaczerwienienie i gor\u0105czka wymagaj\u0105 pilnej oceny."]]),mn(2,"Kiedy i w jakim uk\u0142adzie?","Okoliczno\u015Bci \u2014 nie osobne rozpoznania.",[["standing","Po staniu","Doprecyzuj, kt\xF3re dolegliwo\u015Bci pojawiaj\u0105 si\u0119 lub nasilaj\u0105 podczas d\u0142u\u017Cszego stania.",["Po kr\xF3tkim staniu","Po wielu godzinach"],["Ci\u0119\u017Cko\u015B\u0107","B\xF3l","Obrz\u0119k"],"Podaj typowy czas stania i por\xF3wnanie z dniami o innej aktywno\u015Bci."],["sitting","Po siedzeniu","Opisz, co dzieje si\u0119 po d\u0142u\u017Cszym siedzeniu, np. podczas pracy lub podr\xF3\u017Cy.",["W pracy","W podr\xF3\u017Cy","Po wielu godzinach"],["Ci\u0119\u017Cko\u015B\u0107","B\xF3l","Obrz\u0119k"],"Podaj czas siedzenia i moment pojawienia si\u0119 objaw\xF3w. Nag\u0142ego obrz\u0119ku lub b\xF3lu nie t\u0142umacz wy\u0142\u0105cznie podr\xF3\u017C\u0105."],["evening","Pod koniec dnia","Por\xF3wnaj stan n\xF3g rano i wieczorem. Taki wzorzec jest informacj\u0105 dla lekarza, nie samodzielnym testem diagnostycznym.",["Wieczorem","Po pracy","Po wysi\u0142ku"],["Ci\u0119\u017Cko\u015B\u0107","Obrz\u0119k","B\xF3l"],"Powiedz tak\u017Ce, czy objawy ust\u0119puj\u0105 po odpoczynku i czy wyst\u0119puj\u0105 rano."],["one-leg","Jedna noga","Zaznacz stron\u0119 i to, czy r\xF3\u017Cnica mi\u0119dzy nogami jest nowa.",["Prawa","Lewa","Nag\u0142y pocz\u0105tek","Od dawna"],["B\xF3l","Obrz\u0119k","Zmiana sk\xF3ry"],"Nowa jednostronna dolegliwo\u015B\u0107 z obrz\u0119kiem lub b\xF3lem wymaga pilnej oceny, a nie automatycznej rezerwacji odleg\u0142ego terminu."],["both-legs","Obie nogi","Por\xF3wnaj obie nogi i opisz, czy dolegliwo\u015Bci s\u0105 podobne. Obustronno\u015B\u0107 nie ustala przyczyny.",["Podobnie po obu stronach","Jedna bardziej","Od dawna"],["Ci\u0119\u017Cko\u015B\u0107","Obrz\u0119k","B\xF3l"],"Wymie\u0144 choroby przewlek\u0142e, przyjmowane leki i zmiany aktywno\u015Bci."],["recurrence","Nawr\xF3t po zabiegu","Opisz, co wr\xF3ci\ taleniu rozpoznania, wskaza\u0144, zakresu i planu zabiegu. Wygl\u0105d n\xF3g i dolegliwo\u015Bci omawiamy razem, bez pomniejszania \u017Cadnego z tych powod\xF3w.",discuss:["Zakres diagnostyki i badanie USG potrzebne do zaplanowania leczenia.","Mo\u017Cliwo\u015Bci leczenia wewn\u0105trz\u017Cylnego, zabieg\xF3w uzupe\u0142niaj\u0105cych lub innych metod, zale\u017Cnie od kwalifikacji.","Strona i zakres operacji, znieczulenie, powr\xF3t do aktywno\u015Bci oraz ryzyka, w tym krwawienia i zakrzepicy."],prepare:["Przynie\u015B wcze\u015Bniejsze USG i opis poprzedniego leczenia, je\u015Bli je masz.","Przygotuj list\u0119 lek\xF3w, zw\u0142aszcza wp\u0142ywaj\u0105cych na krzepni\u0119cie.","Powiedz, jaki problem chcesz rozwi\u0105za\u0107 i czego obawiasz si\u0119 przed zabiegiem."],cta:"Um\xF3w kwalifikacj\u0119 do leczenia \u017Cylak\xF3w"},{id:"after-vein-treatment",title:"Zosta\u0142y zmiany lub problem wr\xF3ci\u0142 po leczeniu",need:"Chc\u0119 wiedzie\u0107, co mo\u017Cna zrobi\u0107 dalej.",intro:"Mo\u017Cesz zg\u0142osi\u0107 pozosta\u0142e naczynka, ponownie widoczne \u017Cy\u0142y albo utrzymuj\u0105ce si\u0119 dolegliwo\u015Bci. Najpierw ustalamy, co obecnie wymaga oceny \u2014 bez zak\u0142adania z g\xF3ry przyczyny i bez obietnicy jednego zabiegu dla wszystkich.",discuss:["Co by\u0142o leczone, jak\u0105 metod\u0105 i kiedy.","Kt\xF3re zmiany s\u0105 obecnie widoczne i czy towarzysz\u0105 im dolegliwo\u015Bci.","Czy potrzebna jest dalsza diagnostyka i jaki plan uzupe\u0142niaj\u0105cy mo\u017Cna zaproponowa\u0107."],prepare:["Przygotuj dokumentacj\u0119 poprzednich zabieg\xF3w.","Wska\u017C, co pozosta\u0142o, a co pojawi\u0142o si\u0119 p\xF3\u017Aniej.","Powiedz, z jakiego efektu by\u0142aby\u015B lub by\u0142by\u015B zadowolony."],cta:"Um\xF3w ocen\u0119 po wcze\u015Bniejszym leczeniu"}],proktologia:[{id:"hemorrhoid-treatment",title:"Szukam zabiegowego leczenia hemoroid\xF3w",need:"Chc\u0119 om\xF3wi\u0107 metody i ustali\u0107 plan.",intro:"Nie musis
