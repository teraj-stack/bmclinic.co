name: BM Clinic — build verification

on:
  push:
    branches: [main, bmclinic-ci-vercel-readiness-20261117]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Next.js production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Check patient paths and navigation
        run: node scripts/check-patient-paths.mjs
      - name: Build production application
        run: npm run build
